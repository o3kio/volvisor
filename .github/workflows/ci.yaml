name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # RUSTFLAGS does not reach rustdoc; the doc gate needs its own
  # denial flag or pre-existing rustdoc warnings rot silently
  # (review NIT-3).
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --locked --no-deps --document-private-items

  # The real-backend harness is itself code: keep the one-command scripts
  # syntactically sound, the release scope machine-readable, and the
  # release gate graph non-bypassable on every change. This job does not
  # run Ceph/DRBD (no rig exists in hosted CI); the scheduled
  # real-backends workflow does that on self-hosted runners.
  test-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the real-backend shell scripts
        run: |
          bash -n scripts/test-lvm.sh scripts/test-ceph.sh scripts/test-drbd.sh \
            scripts/lib/real-backends-common.sh \
            scripts/bench/lib.sh scripts/bench/run-all.sh scripts/bench/publish.sh
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x scripts/test-lvm.sh scripts/test-ceph.sh scripts/test-drbd.sh \
            scripts/lib/real-backends-common.sh \
            scripts/bench/lib.sh scripts/bench/run-all.sh scripts/bench/publish.sh
      - name: Validate the release scope
        run: python3 scripts/release-scope.py check
      - name: Validate the release gate graph
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f) }' \
            .github/workflows/real-backends.yaml .github/workflows/release.yaml
          ruby scripts/lib/check-release-graph.rb \
            .github/workflows/release.yaml .github/workflows/real-backends.yaml

  lvm-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LVM2
        run: sudo apt-get update && sudo apt-get install -y lvm2
      - name: Run the real-LVM gate through the release script
        run: sudo -E env "PATH=$PATH" VOLVISOR_TEST_OUTPUT_DIR="$GITHUB_WORKSPACE/target/real-backends/lvm" ./scripts/test-lvm.sh
      - name: Upload the LVM gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-real-backends-lvm
          path: target/real-backends/lvm/
          if-no-files-found: warn
          retention-days: 7

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      # dtolnay/rust-toolchain exports RUSTUP_TOOLCHAIN, which overrides the
      # rust-toolchain.toml `stable` pin for this job.
      - uses: Swatinem/rust-cache@v2
      # Enforce the declared workspace rust-version (1.85, the edition-2024
      # minimum) against the committed lockfile. If a dependency drifts to a
      # version needing a newer compiler, this job fails and the dep must be
      # pinned back or the MSRV claim raised deliberately.
      - run: cargo check --workspace --locked --all-targets

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned for reproducibility; bump deliberately with a lockfile review.
      # Must stay new enough to parse the current upstream RUSTSEC advisory
      # DB format (0.18.5 fails on 2026-10 advisories).
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check

  # The packaging gate (P7-C): build the .deb and .rpm exactly as the
  # release pipeline builds them, then smoke both in stock distro
  # containers, so packaging regressions surface per change instead of
  # at release time. These two jobs deliberately duplicate the build
  # and smoke jobs of .github/workflows/release.yaml — the release
  # workflow's header explains why duplication beats a fragile
  # composite here. No release is created or implied.
  package-build:
    runs-on: ubuntu-latest
    outputs:
      describe: ${{ steps.stamp.outputs.describe }}
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p volvisord --bins
      - name: Assert the binary stamp and derive the package version
        id: stamp
        run: |
          set -eu
          describe=$(git describe --tags --always --dirty)
          test "$(./target/release/volvisord --version)" = "volvisord $describe"
          test "$(./target/release/volvisor-witnessd --version)" = "volvisor-witnessd $describe"
          version=$(./packaging/package-version.sh)
          echo "describe=$describe" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the packaging tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: packaging-tools-${{ runner.os }}-cargo-deb-3.8.0-cargo-generate-rpm-0.21.0
      # Pinned for reproducible packaging; bump deliberately (the
      # cache key above carries the same versions).
      - name: Install the packaging tools
        run: |
          command -v cargo-deb >/dev/null 2>&1 || cargo install --locked --version 3.8.0 cargo-deb
          command -v cargo-generate-rpm >/dev/null 2>&1 || cargo install --locked --version 0.21.0 cargo-generate-rpm
      - run: cargo deb -p volvisord --deb-version "${{ steps.stamp.outputs.version }}" --output "dist/volvisor_${{ steps.stamp.outputs.version }}_amd64.deb"
      - run: cargo generate-rpm -p crates/volvisord -s 'version = "${{ steps.stamp.outputs.version }}"' -o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ci-packages
          path: dist/

  package-smoke:
    needs: package-build
    strategy:
      fail-fast: false
      matrix:
        container: ["debian:stable", "fedora:latest"]
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    env:
      DESCRIBE: ${{ needs.package-build.outputs.describe }}
      VERSION: ${{ needs.package-build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-packages
          path: dist
      - name: Install and smoke the package
        working-directory: dist
        run: sh ../packaging/smoke.sh "$DESCRIBE" "$VERSION"
