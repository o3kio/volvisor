name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --no-deps --document-private-items

  lvm-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LVM2
        run: sudo apt-get update && sudo apt-get install -y lvm2
      - name: Run LVM-gated integration tests
        run: sudo -E env "PATH=$PATH" VOLVISOR_TEST_LVM=1 cargo test -p volvisor-lvm --features integration-lvm

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # Enforce the declared workspace rust-version (1.85, the edition-2024
      # minimum) against the committed lockfile. If a dependency drifts to a
      # version needing a newer compiler, this job fails and the dep must be
      # pinned back or the MSRV claim raised deliberately.
      - run: cargo check --workspace --all-targets

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned for reproducibility; bump deliberately with a lockfile review.
      - run: cargo install cargo-deny --locked --version 0.18.5
      - run: cargo deny check
