[package]
name = "volvisor-campaign"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The aggressive failure campaign harness (test-only; never production)"

[lints]
workspace = true

[dependencies]
volvisor-api = { workspace = true }
volvisord = { workspace = true }
volvisor-provider = { workspace = true }
volvisor-drbd = { workspace = true }
volvisor-drbd-testkit = { workspace = true }
volvisor-handoff = { workspace = true }
# The P6-C move fault rows (§9 row 16): the sibling harness drives a
# real LvmProvider over a scripted LVM world — the campaign is
# test-only (never a dependency of anything), so the dependency
# never reaches a production build that does not already carry it.
volvisor-lvm = { workspace = true }
# The journal's `test-faults` feature gates the rollback injection
# (P5 plan §5.4): the campaign is a test-only crate (never a
# dependency of anything), so the feature never reaches a production
# build of the journal.
volvisor-journal = { workspace = true, features = ["test-faults"] }
volvisor-types = { workspace = true }
volvisor-witness = { workspace = true }
axum = { workspace = true }
crc32fast = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"

[dev-dependencies]
# The move fault rows' rigs (the e2e precedent): one isolated
# directory tree per scenario.
tempfile = { workspace = true }
