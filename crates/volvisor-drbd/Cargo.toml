[package]
name = "volvisor-drbd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Volvisor DRBD9 nearline-replicated provider (host-kernel DRBD over an operator-designated LVM VG, P3 slice)"

[lints]
workspace = true

[features]
# Real-cluster integration tests against an operator-provisioned DRBD peer;
# additionally gated at runtime by VOLVISOR_TEST_DRBD=1 (requires the drbd
# kernel module, drbd-utils, a grown peer backing LV and the VOLVISOR_DRBD_*
# environment variables).
integration-drbd = []

[dependencies]
volvisor-types = { workspace = true }
volvisor-provider = { workspace = true }
volvisor-witness = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
volvisor-drbd-testkit = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
axum = { workspace = true }
