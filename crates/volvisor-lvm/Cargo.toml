[package]
name = "volvisor-lvm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Volvisor native-local LVM provider (thick LV, P1 slice)"

[lints]
workspace = true

[features]
# Real-LVM integration tests on loop devices; additionally gated at runtime
# by VOLVISOR_TEST_LVM=1 (requires root + losetup + lvm2).
integration-lvm = []

[dependencies]
volvisor-types = { workspace = true }
volvisor-provider = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
# `time` drives the move drive's supervision poll; `rt` and `sync` back
# the durable writer's `spawn_blocking` of the physical save and its
# `Notify` wake path, so an async caller releases the provider state lock
# and no executor worker is pinned across the write or the wait.
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
